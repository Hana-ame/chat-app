name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      - run: go test ./... -cover -coverprofile=coverage.out -count=1 -timeout 120s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: server/coverage.out

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx playwright test --project=chromium || echo "E2E skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  go-build:
    needs: [go-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build chatd (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w" \
            -o ../chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/chatd/
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: [go-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Assemble release
        run: |
          mkdir -p release
          mv chatd-linux-amd64     release/chatd-linux-amd64
          mv chatd-linux-arm64     release/chatd-linux-arm64
          mv chatd-windows-amd64   release/chatd-windows-amd64.exe
          mv client-dist           release/client-dist
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-release
          path: release/**
