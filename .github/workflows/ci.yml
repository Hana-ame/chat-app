name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ['*']
  pull_request:
    branches: [main, master, dev]

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.3' }
      - run: go vet ./...
      # WS 测试默认启用(ws_test.go 已去掉 WS_ENABLED 门控);
      # WS_ENABLED 仅是生产环境显式关闭 WS 的开关(gateway.go)。
      # -race:ws hub/广播/事务是并发代码,本地不带 race 验证(仅编译反馈)。
      - run: go test ./... -race -cover -coverprofile=coverage.out -count=1 -timeout 240s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: server/coverage.out

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run build
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}
      # 单元测试(vitest,不依赖浏览器);E2E 由 frontend-ci.yml 专职负责,
      # 这里不再重复跑(旧行 `npx playwright test --project=chromium || echo skipped`
      # 依赖不存在的 project 且容错吞失败,已移除)。
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  go-build:
    needs: [go-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.3' }
      - name: Build chatd (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.sha) }}" \
            -o ../chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/chatd/
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: [go-build, frontend-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chatd-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.3' }
      - name: Verify embedded version
        run: |
          EMBEDDED=$(go version -m chatd-linux-amd64 2>/dev/null | grep "main.Version=" | sed 's/.*main.Version=//' | tr -d '"')
          echo "Embedded version: $EMBEDDED"
          EXPECTED="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}"
          echo "Expected version: $EXPECTED"
          if [ "$EMBEDDED" != "$EXPECTED" ]; then
            echo "::error::Embedded version '$EMBEDDED' does not match expected '$EXPECTED'"
            exit 1
          fi
          echo "Version OK!"
      - name: Assemble release
        run: |
          mkdir -p release/client-dist
          mv chatd-linux-amd64        release/chatd-linux-amd64
          mv chatd-linux-arm64        release/chatd-linux-arm64
          mv chatd-windows-amd64.exe  release/chatd-windows-amd64.exe
          cp -r client-dist/*         release/client-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-release
          path: release/**
      - name: Package client dist
        run: |
          tar -czf release/client-dist.tar.gz -C client-dist .
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}"
          TITLE="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.sha) }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets (clobber)..."
            gh release upload "$TAG" \
              release/chatd-linux-amd64 \
              release/chatd-linux-arm64 \
              release/chatd-windows-amd64.exe \
              release/client-dist.tar.gz \
              --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "Auto-built from commit ${GITHUB_SHA}" \
              --target "$GITHUB_SHA" \
              release/chatd-linux-amd64 \
              release/chatd-linux-arm64 \
              release/chatd-windows-amd64.exe \
              release/client-dist.tar.gz
          fi
