name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ['*']
  pull_request:
    branches: [main, master, dev]

jobs:
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - run: go vet ./...
      # WS tests 为后续版本预备，当前版本不启用（需设置 WS_ENABLED=1）
      - run: go test ./... -cover -coverprofile=coverage.out -count=1 -timeout 120s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: server/coverage.out

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}
      - run: npx playwright test --project=chromium || echo "E2E skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/

  go-build:
    needs: [go-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23' }
      - name: Build chatd (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X main.Version=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}" \
            -o ../chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/chatd/
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: chatd-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          if-no-files-found: error

  release:
    needs: [go-build, frontend-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chatd-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist
      - name: Assemble release
        run: |
          mkdir -p release/client-dist
          mv chatd-linux-amd64        release/chatd-linux-amd64
          mv chatd-linux-arm64        release/chatd-linux-arm64
          mv chatd-windows-amd64.exe  release/chatd-windows-amd64.exe
          cp -r client-dist/*         release/client-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: chatd-release
          path: release/**
      - name: Package client dist
        run: |
          tar -czf release/client-dist.tar.gz -C client-dist .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}"
          TITLE="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.sha) }}"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Auto-built from commit ${GITHUB_SHA}" \
            --target "$GITHUB_SHA" \
            release/chatd-linux-amd64 \
            release/chatd-linux-arm64 \
            release/chatd-windows-amd64.exe \
            release/client-dist.tar.gz \
            || echo "::warning::Release creation skipped (may already exist)"
