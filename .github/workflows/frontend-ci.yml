name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mock-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Start Vite and run tests
        run: |
          npx vite --port 5173 &
          sleep 3
          echo "=== Debug: fetch login page ==="
          curl -s http://localhost:5173/login | head -30
          echo "=== Debug: fetch root ==="
          curl -s http://localhost:5173/ | head -30
          echo "=== Running tests ==="
          npx playwright test tests/ci.spec.mjs tests/real-time.spec.mjs --reporter=list 2>&1

  full-e2e:
    needs: mock-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Start servers and run tests
        shell: bash
        run: |
          cd ${{ github.workspace }}/server
          go mod download
          go build -o /tmp/chatd ./cmd/chatd/
          /tmp/chatd &
          cd ${{ github.workspace }}/client
          npx vite --port 5173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null 2>&1 && echo "backend ready" && break
            sleep 1
          done
          echo "starting tests..."
          npx playwright test tests/e2e.spec.mjs --reporter=list 2>&1