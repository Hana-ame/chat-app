name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mock-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx vite --port 5173 &
      - run: npx playwright test tests/ci.spec.mjs --reporter=list

  full-e2e:
    needs: mock-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: cd server && go mod download && go run ./cmd/server/ &
      - run: npx vite --port 5173 &
      - run: npx playwright test tests/e2e.spec.mjs --reporter=list