name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: client

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: client

      - name: Build Frontend
        run: npm run build
        working-directory: client

      - name: Start Backend (Mock/Test Mode)
        run: |
          # Note: This assumes the server can be built and run on Ubuntu.
          # In a real scenario, we might use a docker-compose or a pre-built binary.
          # For this project, we'll try to build and run the Go server.
          go mod download
          go build -o server ./server/cmd/server
          ./server &
        shell: bash

      - name: Run E2E Tests
        run: npm test
        working-directory: client
        env:
          BASE_URL: http://localhost:8080
