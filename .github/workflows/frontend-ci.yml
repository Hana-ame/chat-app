name: Frontend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mock-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: npx playwright test tests/ci.spec.mjs --project=chromium --reporter=list 2>&1; echo \"EXIT_CODE=$?\"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/test-results/
          if-no-files-found: ignore

  full-e2e:
    needs: mock-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: |
          cd server
          go mod download
          go run ./cmd/server/ &
          cd ../client
          npx vite --port 5173 &
          sleep 3
      - run: npx playwright test tests/e2e.spec.mjs --project=chromium --reporter=list 2>&1; echo "EXIT_CODE=$?"