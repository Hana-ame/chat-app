<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Widget Test</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #8b949e; margin-bottom: 32px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Chat Widget Demo</h1>
    <p>Click the floating ball in the bottom-right corner to open the chat room.</p>
    <p style="font-size: 13px; color: #555;">Drag it to reposition. Your session is saved locally.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/Hana-ame/chat-app@main/widget.js?v=4"></script>
</body>
</html>
